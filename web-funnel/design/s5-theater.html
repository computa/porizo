<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Porizo — Writing Sarah's song…</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="base.css" />
</head>
<body>
  <div class="shell">
    <header class="shell-top">
      <a class="brand" href="/">Porizo</a>
      <span></span>
    </header>

    <main class="step theater">
      <h1 class="q" style="text-align:center">Writing Sarah's song…</h1>
      <p class="stage-label" aria-live="polite">Finding the melody</p>
      <div class="progress" role="progressbar" aria-label="Making your song"><i></i></div>

      <div class="lyric-feed" aria-live="polite">
        <p class="line">Broome under a broken-down sky,</p>
        <p class="line">you laughed till the headlights died —</p>
        <p class="line">Sarah, you make the long way home</p>
        <p class="line">feel like the best night of our lives.</p>
      </div>

      <p class="hint" style="text-align:center; margin-top: var(--sp-6)">
        Usually under two minutes. Keep this tab open —
        <button class="btn-quiet" style="display:inline; padding: 0 4px">or we can email you a link</button>
      </p>
    </main>
  </div>
</body>
</html>
