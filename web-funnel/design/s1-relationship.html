<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Porizo — Sarah is your…</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="base.css" />
</head>
<body>
  <div class="shell">
    <header class="shell-top">
      <button class="back" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <nav class="dots" aria-label="Progress">
        <i class="done"></i><i class="on"></i><i></i><i></i><i></i>
      </nav>
      <span style="width:44px"></span>
    </header>

    <main class="step">
      <h1 class="q">Sarah is your…</h1>
      <p class="hint">So the song speaks the way you two speak.</p>
      <div class="chips" role="group" aria-label="Relationship">
        <button class="chip" aria-pressed="true">Mum</button>
        <button class="chip" aria-pressed="false">Dad</button>
        <button class="chip" aria-pressed="false">Partner</button>
        <button class="chip" aria-pressed="false">Wife</button>
        <button class="chip" aria-pressed="false">Husband</button>
        <button class="chip" aria-pressed="false">Friend</button>
        <button class="chip" aria-pressed="false">Daughter</button>
        <button class="chip" aria-pressed="false">Son</button>
        <button class="chip" aria-pressed="false">Grandma</button>
        <button class="chip" aria-pressed="false">Grandpa</button>
        <button class="chip" aria-pressed="false">Sister</button>
        <button class="chip" aria-pressed="false">Brother</button>
        <button class="chip" aria-pressed="false">Someone else…</button>
      </div>
    </main>

    <div class="cta-bar">
      <button class="btn-primary">Next</button>
    </div>
  </div>
</body>
</html>
