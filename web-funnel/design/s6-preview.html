<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Porizo — Sarah's song</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="base.css" />
</head>
<body class="dim dim-page">
  <div class="shell" style="position:relative">
    <header class="shell-top">
      <button class="back" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <a class="brand" href="/">Porizo</a>
      <span style="width:44px"></span>
    </header>

    <main class="step" style="text-align:center; padding-bottom: calc(var(--cta-h) + 96px)">
      <h1 style="font-size: var(--fs-display)">Sarah's song</h1>
      <p class="muted" style="margin: var(--sp-2) 0 var(--sp-5); font-size: var(--fs-small)">
        This is the chorus — the full song runs about 90 seconds.
      </p>

      <button class="play-btn" aria-label="Play Sarah's song">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
      </button>

      <div class="lyrics" style="margin: var(--sp-6) 0 var(--sp-5); text-align:center" aria-label="Lyrics">
        <p class="past">Broome under a broken-down sky,</p>
        <p class="now">Sarah, you make the long way home</p>
        <p class="next">feel like the best night of our lives —</p>
        <p class="next">we move, we move, whatever comes.</p>
      </div>

      <div class="scrub" role="progressbar" aria-label="Playback position"><i></i></div>
      <div class="timecode"><span>0:07</span><span>0:21</span></div>

      <p style="margin-top: var(--sp-5)">
        <button class="btn-quiet" style="color: var(--karaoke)">Change something in the lyrics</button>
      </p>
    </main>

    <div class="cta-bar" style="background: linear-gradient(rgba(20,16,12,0), var(--ink-deep) 40%)">
      <button class="btn-primary">Unlock the full song</button>
    </div>
  </div>
</body>
</html>
