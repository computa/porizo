<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Porizo — Who is this song for?</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="base.css" />
</head>
<body>
  <div class="shell">
    <header class="shell-top">
      <a class="brand" href="/">Porizo</a>
      <nav class="dots" aria-label="Progress">
        <i class="on"></i><i></i><i></i><i></i><i></i>
      </nav>
    </header>

    <main class="step">
      <h1 class="q">Who's this song for?</h1>
      <p class="hint">Their name will be sung in the lyrics.</p>
      <label for="name" class="visually-hidden" style="position:absolute;left:-9999px">Their name</label>
      <input id="name" class="field big" type="text" placeholder="Their name" autocomplete="off" autofocus value="Sarah" />
    </main>

    <div class="cta-bar">
      <button class="btn-primary">Next</button>
    </div>
  </div>
</body>
</html>
