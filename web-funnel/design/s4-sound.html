<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Porizo — How should it sound?</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="base.css" />
</head>
<body>
  <div class="shell">
    <header class="shell-top">
      <button class="back" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <nav class="dots" aria-label="Progress">
        <i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="on"></i>
      </nav>
      <span style="width:44px"></span>
    </header>

    <main class="step">
      <h1 class="q">How should it sound?</h1>
      <p class="hint">Pick what she'd play in the car.</p>

      <div class="chips choice-rail style-rail" role="group" aria-label="Style" style="margin-bottom: var(--sp-3)">
        <button class="chip" aria-pressed="true">Acoustic</button>
        <button class="chip" aria-pressed="false">Pop</button>
        <button class="chip" aria-pressed="false">Soul</button>
        <button class="chip" aria-pressed="false">R&amp;B</button>
        <button class="chip" aria-pressed="false">Ballad</button>
        <button class="chip" aria-pressed="false">Country</button>
        <button class="chip" aria-pressed="false">Afrobeats</button>
        <button class="chip" aria-pressed="false">Highlife</button>
        <button class="chip" aria-pressed="false">Amapiano</button>
        <button class="chip" aria-pressed="false">More styles…</button>
      </div>

      <p style="font-size: var(--fs-small); color: var(--ink-3); margin-bottom: var(--sp-2)">The feeling</p>
      <div class="chips choice-rail" role="group" aria-label="Mood" style="margin-bottom: var(--sp-3)">
        <button class="chip" aria-pressed="true">Warm</button>
        <button class="chip" aria-pressed="false">Joyful</button>
        <button class="chip" aria-pressed="false">Emotional</button>
        <button class="chip" aria-pressed="false">Playful</button>
      </div>

      <p style="font-size: var(--fs-small); color: var(--ink-3); margin-bottom: var(--sp-2)">The voice</p>
      <div class="chips" role="group" aria-label="Voice">
        <button class="chip" aria-pressed="true">Female voice</button>
        <button class="chip" aria-pressed="false">Male voice</button>
      </div>
    </main>

    <div class="cta-bar">
      <button class="btn-primary">Write Sarah's song</button>
    </div>
  </div>
</body>
</html>
