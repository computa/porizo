<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Porizo — Make her song (mid-flow)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="base.css" />
</head>
<body>
  <div class="shell">
    <header class="shell-top">
      <a class="brand" href="/">Porizo</a>
      <span></span>
    </header>

    <!-- THE FLOW MODEL: answered steps collapse to summary rows; the live
         question sits in the same focus zone. The user stays; the page grows. -->
    <main class="stack" style="flex:1; padding-bottom: calc(var(--cta-h) + var(--sp-6))">

      <button class="step-done">
        <span class="k">For</span>
        <span class="v">Sarah</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </button>

      <button class="step-done">
        <span class="k">Your</span>
        <span class="v">Mum</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </button>

      <button class="step-done">
        <span class="k">Moment</span>
        <span class="v">I Love You ❤️</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </button>

      <section class="step-live">
        <h1 class="q">Tell us one real memory.</h1>
        <p class="hint">The small detail only you two know — that's the line that makes her cry.</p>
        <textarea class="field" placeholder="The road trip where the car broke down outside Broome, and she turned it into the best night of the year…"></textarea>
        <div class="field-row">
          <span class="hint" style="margin:0">Plain words beat perfect words.</span>
          <span class="count">0 / 2000</span>
        </div>
      </section>

    </main>

    <div class="cta-bar">
      <button class="btn-primary">Next</button>
    </div>
  </div>
</body>
</html>
