name: Agent execution policy

on:
  pull_request:
    paths:
      - AGENTS.md
      - package.json
      - docs/agent-execution-policy.md
      - .agents/skills/porizo-execution-loop/SKILL.md
      - scripts/agent/**
      - .github/workflows/agent-execution-policy.yml
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - package.json
      - docs/agent-execution-policy.md
      - .agents/skills/porizo-execution-loop/SKILL.md
      - scripts/agent/**
      - .github/workflows/agent-execution-policy.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run agent:policy-check
